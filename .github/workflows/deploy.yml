name: Deploy App & Webpage

on:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "deploy-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  check-version:
    name: Check for version tag
    runs-on: ubuntu-latest
    outputs:
      match: ${{ steps.check.outputs.match }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check commit message for version
        id: check
        run: |
          MSG=$(git log -1 --pretty=%B)
          echo "$MSG"
          if printf '%s' "$MSG" | grep -Eq 'v[0-9]+\.[0-9]+\.[0-9]+'; then
            VER=$(printf '%s' "$MSG" | grep -Eo 'v[0-9]+\.[0-9]+\.[0-9]+' | head -1)
            echo "match=true" >> "$GITHUB_OUTPUT"
            echo "version=$VER" >> "$GITHUB_OUTPUT"
            echo "Version found -> building ($VER)"
          else
            echo "match=false" >> "$GITHUB_OUTPUT"
            echo "No version -> skipping app build"
          fi

  build-android:
    name: Build Android APK + AAB
    needs: check-version
    if: needs.check-version.outputs.match == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Capacitor Android
        run: |
          mkdir -p android/app/src/main/assets
          npx cap sync android

      - name: Build APK and AAB
        run: |
          cd android
          ./gradlew assembleDebug
          ./gradlew bundle

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 60

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-bundle
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 60

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-version.outputs.version }}
          name: Philosophy2Go ${{ needs.check-version.outputs.version }}
          generate_release_notes: true
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab

  deploy-webpage:
    name: Deploy VitePress to GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run docs:build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4