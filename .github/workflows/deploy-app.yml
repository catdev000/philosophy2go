name: Build App

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK + AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check commit message for version
        id: check
        run: |
          MSG=$(git log -1 --pretty=%B)
          echo "$MSG"
          if printf '%s' "$MSG" | grep -Eq 'v[0-9]+\.[0-9]+\.[0-9]+'; then
            VER=$(printf '%s' "$MSG" | grep -Eo 'v[0-9]+\.[0-9]+\.[0-9]+' | head -1)
            echo "match=true" >> "$GITHUB_OUTPUT"
            echo "version=$VER" >> "$GITHUB_OUTPUT"
            echo "Version found -> building ($VER)"
          else
            echo "match=false" >> "$GITHUB_OUTPUT"
            echo "No version -> skipping"
          fi

      - name: Setup Java
        if: steps.check.outputs.match == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        if: steps.check.outputs.match == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: steps.check.outputs.match == 'true'
        run: npm ci

      - name: Setup Capacitor Android
        if: steps.check.outputs.match == 'true'
        run: |
          mkdir -p android/app/src/main/assets
          npx cap sync android

      - name: Build APK and AAB
        if: steps.check.outputs.match == 'true'
        run: |
          cd android
          ./gradlew assembleDebug
          ./gradlew bundle

      - name: Upload APK
        if: steps.check.outputs.match == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 60

      - name: Upload AAB
        if: steps.check.outputs.match == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-bundle
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 60

      - name: Create GitHub Release
        if: steps.check.outputs.match == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check.outputs.version }}
          name: Philosophy2Go ${{ steps.check.outputs.version }}
          generate_release_notes: true
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab