name: Build App

on:
  workflow_run:
    workflows: ["Deploy VitePress to GitHub Pages"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    if: github.event.workflow_run.conclusion == 'success'
    name: Build Android APK + AAB
    runs-on: ubuntu-latest
    steps:
      - name: Check commit message for version
        id: check
        env:
          MSG: ${{ github.event.workflow_run.head_commit.message || github.event.head_commit.message }}
        run: |
          echo "Commit message:"
          echo "$MSG"
          if printf '%s' "$MSG" | grep -Eq 'v[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "match=true" >> "$GITHUB_OUTPUT"
            echo "Version found -> building"
          else
            echo "match=false" >> "$GITHUB_OUTPUT"
            echo "No version -> skipping"
          fi

      - name: Checkout
        if: steps.check.outputs.match == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Java
        if: steps.check.outputs.match == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        if: steps.check.outputs.match == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: steps.check.outputs.match == 'true'
        run: npm ci

      - name: Build web + sync into Capacitor
        if: steps.check.outputs.match == 'true'
        run: npm run cap:sync

      - name: Build APK and AAB
        if: steps.check.outputs.match == 'true'
        run: |
          cd android
          ./gradlew assembleDebug
          ./gradlew bundle

      - name: Upload APK
        if: steps.check.outputs.match == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 60

      - name: Upload AAB
        if: steps.check.outputs.match == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-bundle
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 60